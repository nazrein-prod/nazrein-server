name: CICD PROD Deployment

on:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"

      - name: Install dependencies
        run: |
          go mod download
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2

      - name: Verify go.mod is tidy
        run: |
          cp go.mod go.mod.bak && cp go.sum go.sum.bak
          go mod tidy
          if ! diff -q go.mod go.mod.bak >/dev/null || ! diff -q go.sum go.sum.bak >/dev/null; then
            echo "::error::go.mod/go.sum are not tidy. Run 'go mod tidy' and commit the result."
            diff go.mod.bak go.mod || true
            diff go.sum.bak go.sum || true
            exit 1
          fi
          rm go.mod.bak go.sum.bak

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify OpenAPI codegen is up to date
        run: |
          go generate ./...
          if ! git diff --exit-code --stat; then
            echo "::error::internal/api/api.gen.go is stale. Run 'go generate ./...' and commit the result."
            exit 1
          fi

      - name: Run golangci-lint
        run: golangci-lint run

      - name: Run tests
        run: |
          go test ./...

  push-to-dockerhub:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image to dockerhub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ vars.DOCKER_USERNAME }}/nazrein:server-latest
            ${{ vars.DOCKER_USERNAME }}/nazrein:server-${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: true

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - push-to-dockerhub

    steps:
      - name: Join Tailscale network
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:cicd
          version: latest
          use-cache: "true"

      # - name: Checkout repository
      #   uses: actions/checkout@v7

      # - name: Run Clickhouse migrations
      #   run: |
      #     migrate \
      #       -database "clickhouse://${secrets.CLICKHOUSE_USER}:${secrets.CLICKHOUSE_PASSWORD}@${secrets.CLICKHOUSE_HOST}:${secrets.CLICKHOUSE_PORT}?database=${secrets.CLICKHOUSE_DB}&x-multi-statement=true" \
      #       -path migrations/analytics/ up

      - name: Deploy or update stack
        run: |
          ssh -o StrictHostKeyChecking=no deploy@nazrein << 'EOF'
            set -e
            cd /home/deploy
            docker stack deploy -c nazrein.prod.yml nazrein
          EOF
