# yaml-language-server: $schema=https://raw.githubusercontent.com/oapi-codegen/oapi-codegen/HEAD/configuration-schema.json
package: api
generate:
  models: true
  chi-server: true
  # Embeds the spec in the binary so OapiRequestValidator can validate requests
  # against the full JSON Schema at runtime (minimum/maximum/enum/required),
  # not just bind and type-check parameters.
  embedded-spec: true
output: ../internal/api/api.gen.go
